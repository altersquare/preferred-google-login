<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#5b93f7"/>
			<stop offset="1" stop-color="#1a5fd0"/>
		</linearGradient>
		<radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
			<stop offset="0.7" stop-color="#ffffff" stop-opacity="0.06"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
		</radialGradient>
		<clipPath id="squircle">
			<rect x="4" y="4" width="120" height="120" rx="28"/>
		</clipPath>
	</defs>

	<rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

	<!-- subtle top-left highlight, fading out with no hard edge -->
	<g clip-path="url(#squircle)">
		<ellipse cx="34" cy="14" rx="96" ry="62" fill="url(#sheen)"/>
	</g>

	<!-- avatar: head + shoulders -->
	<g clip-path="url(#squircle)">
		<circle cx="56" cy="50" r="18" fill="#ffffff"/>
		<path d="M26 102 a30 27 0 0 1 60 0 z" fill="#ffffff"/>
	</g>

	<!-- checkmark badge -->
	<circle cx="92" cy="88" r="23" fill="#34A853" stroke="#ffffff" stroke-width="6"/>
	<path d="M82 88.5 l7 7 l14 -14" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
